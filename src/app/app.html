<div class="app-content">
    <app-header />
    <app-hero />
    <app-about />
    <app-menu />
    <app-gallery />

            <div class="loader-logo">
                <img src="/assets/images/logo_mola.png" alt="Mola">
            </div>
        </div>
    </div>
}
